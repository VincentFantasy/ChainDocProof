spring.application.name=chaindocproof-server
server.port=8080

# ---------- 数据库（MySQL 8） ----------
spring.datasource.url=jdbc:mysql://localhost:3306/chaindocproof?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# ---------- 文件上传 ----------
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=51MB

# ---------- 链配置（默认 Sepolia 测试网） ----------
chain.rpc-url=https://ethereum-sepolia-rpc.publicnode.com
chain.chain-id=11155111
# 后端/管理端钱包私钥（用于调用 storeProof、mint 签名；用户购买次数时销毁的是自己的 DocToken，不转入该地址）
chain.admin-private-key=
chain.gas-price-gwei=30
# gas 上限须落在区间 [storeProof 实际开销, 钱包余额÷gasPrice]：
#   实际约 69 万 gas（写 proofs 数组 5 槽 + hashIndex 映射 + 事件日志）→ 下限约 688645
#   节点会按 上限×gasPrice 预留（未用部分退还），故 上限×gasPrice 须 ≤ 钱包余额
# 850000 覆盖 69 万并适配当前钱包余额；给管理钱包补足 Sepolia ETH 后可提到 1000000
chain.gas-limit=850000

# ---------- 合约地址（部署后填入） ----------
contract.doc-token=
contract.doc-proof=

# ---------- 业务配置 ----------
# 购买 1 次次数需销毁的 DocToken（wei，默认 10 枚）
# app.credit.unit-price-doc-token=10000000000000000000
app.credit.unit-price-doc-token=1000000000000000000
# 单笔购买次数上限
app.credit.purchase-max=1000
# 同一用户两次上传的最小间隔（秒）
app.upload.cooldown-seconds=60
# 管理端登录失败后的全局锁定时间（秒）
app.admin.login-lock-seconds=60
# 登录 token 有效期（小时）
app.token.ttl-hours=168
